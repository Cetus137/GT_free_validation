[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tracking-validation"
version = "0.2.0"
description = "Simulated 3D cell tissues, injected tracking errors, and neighbourhood-continuity metrics (WIO, RC, track survival)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
# Always test THIS repo's source, even if another copy of tracking_validation
# is installed (editable or otherwise) in the active environment.
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
